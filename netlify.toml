[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Decap CMS (public/admin) and config.yml (public/admin/config.yml) are static files
# in public/ and served directly by Netlify. No admin redirect is needed.
# Netlify Identity + Git Gateway serve the /api/ endpoints used by Decap automatically.
